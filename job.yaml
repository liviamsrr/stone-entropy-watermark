# Parâmetros do job. Envie com: sauron submit -c job.yaml script.sh
# Os comandos ficam no script.sh. Antes do primeiro envio, rode na sessão de login:
#   python3 src/baixar_dados.py
name: stone-gerar
image: pytorch/pytorch:2.13.0-cuda13.0-cudnn9-devel
gpus: 1
# vram: VRAM mínima por GPU, em GB. Qwen2.5-Coder-7B em fp16 ocupa ~15 GB de pesos;
# some o cache KV e os logits (~1-3 GB nas gerações deste projeto).
# Preencha com a menor classe que atenda (veja sauron status).
vram: PREENCHER
memory: 32g
max_time: 1h               # suficiente para o smoke; aumente para as rodadas completas

# workspace: subpasta de ~/workspace com o código; o job já começa dentro dela
workspace: stone-entropy-watermark

# variáveis NÃO secretas, lidas pelo script.sh
env:
  CONFIG: configs/smoke.yaml
  ARGS: ""                 # ex.: "--sorteio 600 --inicio 0 --fim 200" para fatiar o APPS
